name: Build Fabric

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: bash gradlew :fabric:remapJar --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: vivecraft-fabric
          path: build/libs/*-fabric.jar
          if-no-files-found: error
